<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Telefon Geçidi">
  <title>Telefon Geçidi</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">HÜCRESEL BAĞLANTI</p>
      <h1>Telefon Geçidi</h1>
      <p id="connection-status" class="status" role="status" aria-live="polite">Bağlanılmadı</p>
    </header>

    <section id="pairing-section" class="group" aria-labelledby="pairing-title">
      <h2 id="pairing-title">Bağlan</h2>
      <p class="secondary">İnterneti paylaşan telefonun ekranındaki eşleştirme kodunu girin.</p>
      <form id="pairing-form">
        <label for="pairing-token">Eşleştirme kodu</label>
        <input id="pairing-token" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required minlength="6" maxlength="32" placeholder="6 karakter">
        <label class="remember-row"><input id="remember-token" type="checkbox"> Bu iPhone’da hatırla</label>
        <button id="connect-button" type="submit" class="primary">Bağlan</button>
      </form>
    </section>

    <div id="dashboard" hidden>
      <section class="group" aria-labelledby="call-title">
        <h2 id="call-title">Arama</h2>
        <div class="call-state"><span id="call-state">Arama yok</span><strong id="call-number"></strong></div>
        <div id="incoming-actions" class="actions" hidden>
          <button id="answer-button" type="button" class="primary">Yanıtla</button>
          <button id="reject-button" type="button" class="secondary-button">Reddet</button>
        </div>
        <div id="active-actions" class="actions" hidden>
          <button id="hangup-button" type="button" class="destructive">Aramayı bitir</button>
        </div>
        <form id="dial-form">
          <label for="dial-number">Yeni arama</label>
          <div class="input-action">
            <input id="dial-number" type="tel" inputmode="tel" autocomplete="tel" placeholder="Telefon numarası" required>
            <button id="dial-button" type="submit">Ara</button>
          </div>
        </form>
        <p class="footnote">Arama sesi şu anda geçit telefonunda kalır. iPhone’dan konuşma henüz etkin değildir.</p>
      </section>

      <section class="group" aria-labelledby="messages-title">
        <h2 id="messages-title">Mesajlar</h2>
        <p class="footnote">Bu sayfa açıkken gelen SMS’ler görünür.</p>
        <ol id="message-list" class="message-list" aria-live="polite"></ol>
        <p id="messages-empty" class="empty">Henüz mesaj yok.</p>
        <form id="sms-form">
          <label for="sms-number">Alıcı</label>
          <input id="sms-number" type="tel" inputmode="tel" autocomplete="tel" placeholder="Telefon numarası" required>
          <label for="sms-text">Mesaj</label>
          <textarea id="sms-text" rows="3" maxlength="480" placeholder="Mesaj yazın" required></textarea>
          <button id="sms-button" type="submit" class="primary">SMS gönder</button>
        </form>
      </section>
      <button id="disconnect-button" class="link-button" type="button">Bağlantıyı kes</button>
    </div>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
