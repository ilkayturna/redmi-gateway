name: Build iOS Telefon Gecidi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    name: Compile iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project RedmiGateway/ios/RedmiGateway.xcodeproj \
            -scheme RedmiGateway \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            clean build
