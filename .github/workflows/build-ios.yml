name: Build iOS Telefon Gecidi

on:
  # Documentation-only commits do not start a macOS compile: macOS minutes count ten times against
  # the Actions quota whose exhaustion stopped every workflow on 16.10.2026.
  push:
    branches: [main]
    paths-ignore:
      - '**/docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/docs/**'
      - '**/*.md'
  # A TestFlight build stops opening 90 days after upload. Cron cannot say "every 60 days", so a
  # cheap weekly guard asks App Store Connect how long the installable build has left and only then
  # starts the macOS release (refresh_guard below).
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: Upload a signed build to TestFlight
        type: boolean
        required: true
        default: false
      promote_build:
        description: Add an existing processed build number to the internal TestFlight group
        type: string
        required: false
        default: ''

# One release at a time: a scheduled refresh and a manual release must not upload side by side.
# Pushes and pull requests queue per ref instead of piling up macOS runs. Nothing is cancelled
# while it runs: an upload cut off half way leaves App Store Connect in an unknown state.
concurrency:
  group: build-ios-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  refresh_guard:
    name: Check whether TestFlight needs a fresh build
    # The archive repository receives copies of these workflow files. Without the repository check
    # its cron would fire there too, fail without the signing secrets and mail the owner each week.
    if: github.event_name == 'schedule' && github.repository == 'ilkayturna/redmi-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the guard's date logic
        run: python3 scripts/test_testflight_refresh_needed.py
      - name: Install Apple API signing library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ascenv"
          "$RUNNER_TEMP/ascenv/bin/pip" install --disable-pip-version-check --quiet 'PyJWT[crypto]>=2,<3'
      - name: Read build and certificate expiry
        id: expiry
        shell: bash
        env:
          ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_B64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Serial of the certificate the release signs with, read the way the release job reads
          # it, so the guard watches that certificate and not another one in the account.
          serial=''
          if [ -n "${IOS_DIST_P12_B64:-}" ]; then
            printf '%s' "$IOS_DIST_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
            serial="$( (openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:IOS_DIST_P12_PASSWORD -nokeys -legacy 2>/dev/null \
              || openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:IOS_DIST_P12_PASSWORD -nokeys 2>/dev/null) \
              | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2)" || serial=''
            rm -f "$RUNNER_TEMP/dist.p12"
          fi
          if [ -z "$serial" ]; then
            echo "Signing certificate serial unknown; the guard picks the distribution certificate by itself."
          fi
          CERT_SERIAL="$serial" "$RUNNER_TEMP/ascenv/bin/python" scripts/testflight_refresh_needed.py
      # The scheduled release builds the moving tag testflight/known-good, never main HEAD: an
      # unattended upload must not ship a change that has not passed a real call test (AGENTS 6.1).
      # Without the tag the refresh is skipped with a warning rather than failing every week.
      - name: Find the known-good source
        id: source
        shell: bash
        env:
          DUE: ${{ steps.expiry.outputs.needed }}
        run: |
          if [ "$DUE" != 'true' ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rc=0
          git ls-remote --exit-code --tags origin refs/tags/testflight/known-good > /dev/null || rc=$?
          case "$rc" in
            0)
              echo 'needed=true' >> "$GITHUB_OUTPUT"
              ;;
            2)
              message='A refresh is due but the tag testflight/known-good does not exist, so nothing was built. Point the tag at the commit of a build that passed a real call test; the next weekly run uploads it.'
              echo "::warning title=TestFlight refresh skipped::$message"
              echo "- **Skipped:** $message" >> "$GITHUB_STEP_SUMMARY"
              echo 'needed=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=TestFlight refresh::Could not read the tags of origin (git exit $rc)."
              exit 1
              ;;
          esac

  compile:
    name: Compile iOS app
    # Not on the schedule: the scheduled release builds the known-good tag, which may predate the
    # test files below, and a refresh should not spend macOS minutes testing main.
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.promote_build == '')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Test call audio timing
        shell: bash
        run: |
          set -euo pipefail
          swiftc RedmiGateway/ios/RedmiGateway/CallAudioTiming.swift \
            RedmiGateway/ios/Tests/CallAudioTimingTests.swift \
            -o "$RUNNER_TEMP/call-audio-timing-tests"
          "$RUNNER_TEMP/call-audio-timing-tests"
      # The sealed BLE frame is 29 bytes before any payload, so it can never fit the
      # 20 bytes a default ATT_MTU allows. The Redmi therefore splits it and the
      # iPhone puts it back together; these tests pin that reassembly, including the
      # timeout, a missing chunk, an orphan chunk and the single-chunk path a large
      # MTU uses.
      - name: Test BLE reassembly
        shell: bash
        run: |
          set -euo pipefail
          swiftc RedmiGateway/ios/RedmiGateway/BLEReassembly.swift \
            RedmiGateway/ios/Tests/BLEReassemblyTests.swift \
            -o "$RUNNER_TEMP/ble-reassembly-tests"
          "$RUNNER_TEMP/ble-reassembly-tests"
      # How the iPhone formats what it reports about itself to the Redmi (log batches and split
      # lines, client_diag parts, TestFlight days left). The iPhone has no USB debugging, so a
      # mistake here loses the only evidence; the file is Foundation-only to be testable here.
      - name: Test diagnostics format
        shell: bash
        run: |
          set -euo pipefail
          swiftc RedmiGateway/ios/RedmiGateway/DiagnosticsFormat.swift \
            RedmiGateway/ios/Tests/DiagnosticsFormatTests.swift \
            -o "$RUNNER_TEMP/diagnostics-format-tests"
          "$RUNNER_TEMP/diagnostics-format-tests"
      # Which parts of a message become tappable phone numbers and links, as in Apple's Messages.
      - name: Test message links
        shell: bash
        run: |
          set -euo pipefail
          swiftc RedmiGateway/ios/RedmiGateway/PhoneLink.swift \
            RedmiGateway/ios/Tests/PhoneLinkTests.swift \
            -o "$RUNNER_TEMP/phone-link-tests"
          "$RUNNER_TEMP/phone-link-tests"
      # The two steps above compile single files, so they never see AudioEngine, CallKitManager or
      # the rest of the app. Two builds in a row failed in the Xcode step and only there: an
      # optional Error cast to NSError, and a bare return in a function that returns Bool. This
      # step type checks every app source together, which is what the Xcode build does, but it
      # reports in seconds and names the file and line.
      - name: Typecheck app sources
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          # The -simulator suffix matters: the simulator SDK ships arm64-apple-ios-simulator
          # libraries, so a bare arm64-apple-ios15.0 target fails with "unable to load standard
          # library" before it ever looks at the sources.
          find RedmiGateway/ios/RedmiGateway -name '*.swift' -print0 \
            | xargs -0 swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.0-simulator
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project RedmiGateway/ios/RedmiGateway.xcodeproj \
            -scheme RedmiGateway \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          test -f derived_data/Build/Products/Debug-iphonesimulator/RedmiGateway.app/PrivacyInfo.xcprivacy
          plutil -lint derived_data/Build/Products/Debug-iphonesimulator/RedmiGateway.app/PrivacyInfo.xcprivacy
      - name: Launch iPhone simulator and capture screen
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in data.values() for d in runtime if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" derived_data/Build/Products/Debug-iphonesimulator/RedmiGateway.app
          xcrun simctl privacy "$device_id" grant microphone com.ilkay.redmigateway.ios
          app_data="$(xcrun simctl get_app_container "$device_id" com.ilkay.redmigateway.ios data)"
          mkdir -p "$app_data/Library/Preferences"
          defaults write "$app_data/Library/Preferences/com.ilkay.redmigateway.ios" pairing_token -string SIMULATOR_PREVIEW
          xcrun simctl launch "$device_id" com.ilkay.redmigateway.ios
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/telefon-gecidi-launch.png"
      - name: Save iPhone launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: telefon-gecidi-iphone-launch
          path: ${{ runner.temp }}/telefon-gecidi-launch.png
          if-no-files-found: error

  testflight:
    name: Sign and upload TestFlight build
    needs: [compile, refresh_guard]
    # A manual release needs a green compile of the same commit, as before. The scheduled refresh
    # needs the guard's go and skips compile (see there). !cancelled() lets the job look past
    # whichever of the two was skipped instead of being skipped with it.
    if: >-
      !cancelled() && (
      (github.event_name == 'workflow_dispatch' && inputs.release == true && needs.compile.result == 'success') ||
      (github.event_name == 'schedule' && github.repository == 'ilkayturna/redmi-gateway' && needs.refresh_guard.outputs.needed == 'true'))
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty keeps the commit that triggered the run, as before.
          ref: ${{ github.event_name == 'schedule' && 'refs/tags/testflight/known-good' || '' }}
      - name: Install Apple signing assets
        shell: bash
        env:
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_DIST_P12_B64"
          test -n "$IOS_DIST_P12_PASSWORD"
          test -n "$IOS_PROFILE_B64"
          printf '%s' "$IOS_DIST_P12_B64" | base64 -D > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$IOS_PROFILE_B64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          keychain="$RUNNER_TEMP/telefon-gecidi.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign
          # Serial of the signing certificate, so the push profile is issued for the same one.
          (openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:IOS_DIST_P12_PASSWORD -nokeys -legacy 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:IOS_DIST_P12_PASSWORD -nokeys 2>/dev/null) \
            | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2 > "$RUNNER_TEMP/cert_serial" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/N6ZRK2NV2U.mobileprovision"
          rm "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"

      - name: Provision push notifications
        id: push
        continue-on-error: true
        shell: bash
        env:
          ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_B64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The runner's Python is externally managed (PEP 668); use a private environment.
          python3 -m venv "$RUNNER_TEMP/pushenv"
          "$RUNNER_TEMP/pushenv/bin/pip" install --disable-pip-version-check --quiet 'PyJWT[crypto]>=2,<3'
          CERT_SERIAL="$(cat "$RUNNER_TEMP/cert_serial" 2>/dev/null || true)" "$RUNNER_TEMP/pushenv/bin/python" scripts/ensure_push_profile.py

      # A build signed without the push entitlement installs and opens normally, but it never rings
      # while the iPhone is away from the Redmi and gets no SMS or missed-call alerts through Apple,
      # and nothing on the phone says why. The step above fails softly so its own log stays
      # readable; this gate stops such a build before anything is archived or uploaded. It has no
      # condition of its own: every run of this job is a release, and a scheduled run has no
      # inputs, so the former `inputs.release == true` would have skipped it there.
      - name: Require push profile for release
        shell: bash
        env:
          PUSH_PROFILE: ${{ steps.push.outputs.push_profile }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_PROFILE:-}" ]; then
            echo "::error title=Push profile missing::Provision push notifications produced no profile (outcome: ${PUSH_OUTCOME}). A TestFlight build without push never rings away from the Redmi, so nothing was archived or uploaded. Fix the step log above and run the release again."
            exit 1
          fi
          echo "Push profile for this release: $PUSH_PROFILE"

      - name: Archive iPhone app
        shell: bash
        env:
          PUSH_PROFILE: ${{ steps.push.outputs.push_profile }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" RedmiGateway/ios/RedmiGateway/Info.plist
          # The iPhone tells the Redmi how many of TestFlight's 90 days its build has left
          # (client_status buildDate/tfDaysLeft); only the build itself can carry when it was made.
          # Delete first so the Add works whether or not the checked out Info.plist has the key.
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          /usr/libexec/PlistBuddy -c "Delete :RGBuildDate" RedmiGateway/ios/RedmiGateway/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :RGBuildDate string $build_date" RedmiGateway/ios/RedmiGateway/Info.plist
          echo "Archiving $(git rev-parse --short HEAD) as build $GITHUB_RUN_NUMBER, RGBuildDate $build_date"
          # With a push profile the app gets the push entitlement. A release never gets here without
          # one (see the gate above); the plain profile is only a fallback that the gate never lets
          # through to an upload.
          profile='Telefon Gecidi App Store 2026'
          entitlements=()
          if [ -n "${PUSH_PROFILE:-}" ]; then
            profile="$PUSH_PROFILE"
            entitlements=(CODE_SIGN_ENTITLEMENTS=RedmiGateway/RedmiGateway.entitlements)
          fi
          echo "$profile" > "$RUNNER_TEMP/profile_name"
          xcodebuild archive \
            -project RedmiGateway/ios/RedmiGateway.xcodeproj \
            -scheme RedmiGateway \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RedmiGateway.xcarchive" \
            DEVELOPMENT_TEAM=6FR2S79P48 \
            CODE_SIGN_STYLE=Manual \
            "PROVISIONING_PROFILE_SPECIFIER=$profile" \
            'CODE_SIGN_IDENTITY=iPhone Distribution' \
            ${entitlements[@]+"${entitlements[@]}"}

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          profile="$(cat "$RUNNER_TEMP/profile_name")"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>6FR2S79P48</string>
            <key>provisioningProfiles</key><dict>
              <key>com.ilkay.redmigateway.ios</key><string>${profile}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RedmiGateway.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        shell: bash
        env:
          ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_B64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_API_KEY_B64"
          test -n "$ASC_API_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_B64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  # The scheduled refresh puts its build in the internal group in the same run, so the iPhone gets
  # it without anyone dispatching promote_build. A manual release keeps that separate step. Linux,
  # because waiting for Apple's processing can take half an hour and macOS minutes count ten times.
  promote_refreshed:
    name: Add the refreshed build to the internal TestFlight group
    needs: testflight
    if: github.event_name == 'schedule' && github.repository == 'ilkayturna/redmi-gateway'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Apple API signing library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ascenv"
          "$RUNNER_TEMP/ascenv/bin/pip" install --disable-pip-version-check --quiet 'PyJWT[crypto]>=2,<3'
      - name: Wait for processing and add build to group
        shell: bash
        env:
          ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_B64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # The testflight job set CFBundleVersion to this run's number.
          ASC_BUILD_NUMBER: ${{ github.run_number }}
        run: '"$RUNNER_TEMP/ascenv/bin/python" scripts/assign_testflight.py'

  promote_existing:
    name: Add build to internal TestFlight group
    if: github.event_name == 'workflow_dispatch' && inputs.promote_build != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Apple API signing library
        run: python3 -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2,<3'
      - name: Wait for processing and add build to group
        env:
          ASC_API_KEY_B64: ${{ secrets.ASC_API_KEY_B64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_BUILD_NUMBER: ${{ inputs.promote_build }}
        run: python3 scripts/assign_testflight.py
