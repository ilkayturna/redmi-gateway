name: Build Android Telefon Gecidi

on:
  push:
    branches: [main, codex/audio-jitter-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test and assemble the Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK and exports ANDROID_HOME, so
      # no extra setup action is needed (setup-android failed here and only added a
      # download step).

      # The unit tests guard the audio path (jitter buffer, call manager). They were
      # broken for a while because nothing ran them in CI; this step keeps them honest.
      - name: Unit tests
        working-directory: RedmiGateway/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          # The committed local.properties points at a developer machine's SDK.
          rm -f local.properties
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble the debug APK
        working-directory: RedmiGateway/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      # Android lint had never run on this project, and its first run on 16.10.2026 found two
      # real crashes: setShowWhenLocked called at minSdk 26, and an unguarded RoleManager
      # reference at API 29. Both are fixed and the backlog is in app/lint-baseline.xml, so
      # this step fails on anything new rather than on what was already there. Why the baseline
      # entries are accepted is written down in RedmiGateway/docs/LINT-NOTLARI.md.
      - name: Android lint
        working-directory: RedmiGateway/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:lintDebug --console=plain

      - name: Upload the lint report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: RedmiGateway/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: redmigateway-debug-apk
          path: RedmiGateway/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: RedmiGateway/android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
